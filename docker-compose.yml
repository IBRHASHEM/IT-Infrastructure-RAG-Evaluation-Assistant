services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-evaluation-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./evaluation:/app/evaluation
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge
